    <meta property="og:site_name" content="Parvez Draw" />
    <meta
      property="og:title"
      content="Parvez Draw - Free Offline Whiteboard"
    />
    <meta
      property="og:description"
      content="Create beautiful hand-drawn diagrams, wireframes, and sketches. Free, open-source, and works offline. No account required."
    />
    <meta property="og:image" content="/parvez.png" />
    <meta property="og:image:alt" content="Parvez Draw - Offline Whiteboard Application" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://parvezdraw.com" />
    <meta
      property="twitter:title"
      content="Parvez Draw - Free Offline Whiteboard"
    />
    <meta
      property="twitter:description"
      content="Create beautiful hand-drawn diagrams, wireframes, and sketches. Free, open-source, and works offline."
    />
    <meta property="twitter:image" content="/parvez.png" />
    <meta property="twitter:image:alt" content="Parvez Draw - Offline Whiteboard Application" />

    <!-- Additional SEO Meta Tags -->
    <meta name="theme-color" content="#006a4e" />
    <meta name="msapplication-navbutton-color" content="#006a4e" />
    <meta name="apple-mobile-web-app-title" content="Parvez Draw" />

    <!-- Structured Data for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Parvez Draw",
      "description": "Free, open-source, offline-first whiteboard tool for creating hand-drawn diagrams, wireframes, and sketches.",
      "url": "https://parvezdraw.com",
      "applicationCategory": "DesignApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Offline-first whiteboard",
        "Hand-drawn style diagrams",
        "Real-time collaboration",
        "Export to PNG, SVG, JSON",
        "Auto-save functionality",
        "Version history",
        "Dark mode support",
        "PWA support"
      ]
    }
    </script>

    <!------------------------------------------------------------------------->
    <!--   to minimize white flash on load when user has dark mode enabled   -->
    <script>
      try {
        function setTheme(theme) {
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        }

        function getTheme() {
          const theme = window.localStorage.getItem("parvezdraw-theme");

          if (theme && theme === "system") {
            return window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          } else {
            return theme || "light";
          }
        }

        setTheme(getTheme());
      } catch (e) {
        console.error("Error setting dark mode", e);
      }
    </script>
    <style>
      html.dark {
        background-color: #0a1612;
        color: #fff;
      }
      html {
        background-color: #f8fafc;
      }
    </style>

    <!-- Warmup the connection for Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!------------------------------------------------------------------------->
    <% if (typeof PROD != 'undefined' && PROD == true) { %>
    <!-- Following placeholder is replaced during the build step -->
    <!-- PLACEHOLDER:EXCALIDRAW_APP_FONTS -->

    <!-- Register Assistant as the UI font, before the scene inits -->
    <link
      rel="stylesheet"
      href="../packages/excalidraw/fonts/fonts.css"
      type="text/css"
    />

    <% } else { %>
    <script>
      window.EXCALIDRAW_ASSET_PATH = window.origin;
    </script>
    <% } %>

    <link rel="apple-touch-icon" sizes="180x180" href="/parvez.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/parvez.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/parvez.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/parvez.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/parvez.png" />
    <link rel="shortcut icon" href="/parvez.png" />

    <!-- Parvez Draw version -->
    <meta name="version" content="{version}" />

    <% if (typeof VITE_APP_DEV_DISABLE_LIVE_RELOAD != 'undefined' &&
    VITE_APP_DEV_DISABLE_LIVE_RELOAD == true) { %>
    <script>
      {
        const _WebSocket = window.WebSocket;
        window.WebSocket = function (url) {
          if (/ws:\/\/localhost:.+?\/sockjs-node/.test(url)) {
            console.info(
              "[!!!] Live reload is disabled via VITE_APP_DEV_DISABLE_LIVE_RELOAD [!!!]",
            );
          } else {
            return new _WebSocket(url);
          }
        };
      }
    </script>
    <% } %>
    <script>
      // setting this so that libraries installation reuses this window tab.
      window.name = "_parvezdraw";
    </script>

    <style>
      body,
      html {
        margin: 0;
        -webkit-text-size-adjust: 100%;

        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .visually-hidden {
        position: absolute !important;
        height: 1px;
        width: 1px;
        overflow: hidden;
        clip: rect(1px, 1px, 1px, 1px);
        white-space: nowrap;
        user-select: none;
      }

      #root {
        height: 100%;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -khtml-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      @media screen and (min-width: 1200px) {
        #root {
          -webkit-touch-callout: default;
          -webkit-user-select: auto;
          -khtml-user-select: auto;
          -moz-user-select: auto;
          -ms-user-select: auto;
          user-select: auto;
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run Parvez Draw.</noscript>
    <header>
      <h1 class="visually-hidden">Parvez Draw - Free Offline Whiteboard</h1>
    </header>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
